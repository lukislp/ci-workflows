name: Dependabot auto-merge

# Thin caller of the shared implementation in lukislp/ci-workflows - the triggers stay here
# because a reusable workflow cannot declare them for the caller. Needs the AUTOMERGE_TOKEN
# repository secret (fine-grained PAT, contents + pull requests write).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, auto_merge_enabled]
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  dependabot:
    uses: lukislp/ci-workflows/.github/workflows/dependabot-auto-merge.yml@SHA # vX.Y.Z
    # Optional: dependencies whose PRs are never approved or merged automatically (comma and/or
    # whitespace separated, case-insensitive exact names; a grouped PR is skipped as a whole).
    # with:
    #   exclude-dependencies: some-package other-package
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
