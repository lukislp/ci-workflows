name: Dependabot lock files (reusable)

# Shared implementation of every repo's dependabot-lockfiles workflow. Dependabot regenerates
# the lock file of the project whose manifest it bumped, but not the lock files of the projects
# that depend on it (NuGet records a reference's dependencies in the referencing project's
# packages.lock.json) - and its uv lock output has shipped unparsable files. Locked-mode restores
# then fail on the PR. This job runs on Dependabot's own PRs, regenerates every lock file with
# the same tool versions CI uses and pushes the result back onto the PR branch, after which the
# normal CI run and the auto-merge proceed.
#
# The caller is a plain pull_request workflow (never pull_request_target): the PR's own restore
# runs in the untrusted context with a read-only GITHUB_TOKEN, and the only credential involved -
# the push token - is a Dependabot secret, which GitHub exposes solely to runs Dependabot
# triggered and only to the single step that pushes. Nothing from the PR ever sees it.
on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version for regenerating packages.lock.json files (empty = repo has no NuGet locks).
        type: string
        default: ""
      uv-version:
        description: uv version for regenerating uv.lock (empty = repo has no uv.lock). Must match the CI pin.
        type: string
        default: ""
      python-version:
        description: >-
          Python version uv resolves against. Taken from the runner's tool cache via
          actions/setup-python, so prefer a version the GitHub-hosted image already ships
          (3.10-3.14 on ubuntu-22.04/24.04) - anything else makes setup-python fetch it.
        type: string
        default: "3.12"
    secrets:
      AUTOMERGE_TOKEN:
        description: Dependabot secret used only to push the refreshed lock files back onto the PR branch.
        required: false
      DEPLOY_SIGNING_KEY:
        description: >-
          Dependabot secret holding an SSH signing key registered to the pushing account. Without
          it the commit below is pushed unsigned, which a required_signatures ruleset rejects -
          see the signing step for detail.
        required: false

permissions:
  contents: read

jobs:
  refresh:
    # The PR AUTHOR, not github.actor. On a synchronize event the actor is whoever pushed
    # last, and the auto-merge workflow's update-stale job rebases open Dependabot PRs with
    # AUTOMERGE_TOKEN - which made every follow-up run skip this job, leaving the lock files
    # stale and the PR permanently red with no way to recover. The author never changes, so
    # this gate is both more reliable and stricter: it still only ever runs on Dependabot PRs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
      HEAD_REF: ${{ github.head_ref }}
      # uv must never download an interpreter from python-build-standalone: that is an
      # external fetch on every single run (it started returning 504 Gateway Timeout on
      # 2026-09-14 and turned CI red at random). The runner's tool cache already ships the
      # version below, resolved locally by actions/setup-python - and with downloads off a
      # missing interpreter fails loudly instead of being pulled in over the network.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "AUTOMERGE_TOKEN is not set as a Dependabot secret - lock files are not refreshed automatically"
      # This job can sit queued long enough for the PR it targets to already be merged (and its
      # branch deleted) by a fast-moving auto-merge run elsewhere - the checkout below then fails
      # with "branch ... could not be found", surfacing as a red check for no real reason. Bail
      # out cleanly instead: GITHUB_TOKEN (read-only, always available) is enough for this check.
      - if: env.HAS_TOKEN == 'true'
        id: pr_state
        name: Check the PR is still open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="$(gh pr view "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" != "OPEN" ]; then
            echo "PR is $state (likely merged while this run was queued) - nothing to refresh"
          fi
      - if: env.HAS_TOKEN == 'true' && steps.pr_state.outputs.state == 'OPEN'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          # Full history so the base branch's uv.lock is available locally (private repos
          # cannot be fetched anonymously later, and the push token stays out of this step).
          fetch-depth: 0
          persist-credentials: false
      - if: env.HAS_TOKEN == 'true' && steps.pr_state.outputs.state == 'OPEN' && inputs.dotnet-version != '' && hashFiles('**/packages.lock.json') != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - if: env.HAS_TOKEN == 'true' && steps.pr_state.outputs.state == 'OPEN' && inputs.dotnet-version != '' && hashFiles('**/packages.lock.json') != ''
        name: Regenerate every packages.lock.json
        run: |
          set -eu
          for lock in $(git ls-files '**/packages.lock.json' 'packages.lock.json'); do
            proj="$(ls "$(dirname "$lock")"/*.csproj | head -1)"
            echo "restoring $proj"
            dotnet restore "$proj" --force-evaluate -p:RestoreLockedMode=false
          done
      - if: env.HAS_TOKEN == 'true' && steps.pr_state.outputs.state == 'OPEN' && inputs.uv-version != '' && hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ inputs.uv-version }}
      - if: env.HAS_TOKEN == 'true' && steps.pr_state.outputs.state == 'OPEN' && inputs.uv-version != '' && hashFiles('uv.lock') != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - if: env.HAS_TOKEN == 'true' && steps.pr_state.outputs.state == 'OPEN' && inputs.uv-version != '' && hashFiles('uv.lock') != ''
        name: Regenerate uv.lock
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Dependabot's own uv.lock output has been unparsable, and `uv lock` refuses to start
          # from a broken file - so resolve from the base branch's lock plus the PR's pyproject.
          #
          # Restoring the base lock alone silently undoes the update, though. A bump that only
          # moves a package inside uv.lock - a transitive dependency, or a direct one whose
          # pyproject range already allows the new version - changes nothing in pyproject.toml,
          # and `uv lock` then keeps every version the base lock records. Between 2026-09-12 and
          # 2026-09-30 every such Dependabot PR in studylife-mcp, studylife-ai and github-dashboard
          # merged as an empty squash, Dependabot re-opened the same bump the next day, and a
          # CRITICAL PyJWT CVE stayed in the studylife-mcp image while its "fix" PR was green and
          # merged. So first record which packages Dependabot moved, then ask uv for exactly those
          # versions. A line scan on purpose, not a TOML parse: Dependabot's file may be the very
          # broken one this step works around. The project's own package is skipped (hatch-vcs
          # versions differ per commit, see below); packages Dependabot added or removed are left
          # to the resolver.
          git show "origin/$BASE_REF:uv.lock" > "$RUNNER_TEMP/base-uv.lock"
          UPGRADES="$(python - uv.lock "$RUNNER_TEMP/base-uv.lock" <<'PY'
          import re, sys, tomllib

          def norm(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          def versions(path):
              found, name = {}, None
              for line in open(path, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\r\n")
                  if line == "[[package]]":
                      name = None
                      continue
                  m = re.fullmatch(r'name = "([^"]+)"', line)
                  if m:
                      name = norm(m.group(1))
                      continue
                  m = re.fullmatch(r'version = "([^"]+)"', line)
                  if m and name:
                      found[name] = m.group(1)
                      name = None
              return found

          dependabot, base = versions(sys.argv[1]), versions(sys.argv[2])
          try:
              own = norm(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])
          except Exception:
              own = None
          print(" ".join(f"--upgrade-package {n}=={v}" for n, v in sorted(dependabot.items())
                         if n != own and n in base and base[n] != v))
          PY
          )"
          if [ -n "$UPGRADES" ]; then
            echo "Dependabot moved: $UPGRADES"
          else
            echo "Dependabot moved no locked package version (manifest-only change) - resolving from pyproject.toml"
          fi
          cp "$RUNNER_TEMP/base-uv.lock" uv.lock

          # Pin the project's OWN version to whatever the base branch recorded, before locking.
          #
          # Repos using hatch-vcs derive it from `git describe`, so it carries the commit count
          # and the HEAD sha: "1.14.18.dev136+g7640d79f2.d20260917". uv writes that into uv.lock.
          # This job then commits, which moves HEAD - so the next run produced a different
          # version, saw a genuine diff, pushed again and triggered itself. On 2026-09-17 that
          # ran away in studylife-mcp: three Dependabot PRs at ~100 self-made commits each, a
          # refresh every 20 seconds, stopping only when the PRs merged. The "already
          # consistent" guard below cannot catch it - the file really does change every time.
          #
          # Reading the value back out of the base lock rather than inventing one keeps the diff
          # limited to real dependency changes. Empty for repos that do not record their own
          # package, where the variable is simply never set and nothing changes for them.
          BASE_VERSION="$(python -c 'import tomllib; n = tomllib.load(open("pyproject.toml", "rb")).get("project", {}).get("name"); l = tomllib.load(open("uv.lock", "rb")); print(next((p.get("version", "") for p in l.get("package", []) if p.get("name") == n), "") if n else "")' 2>/dev/null || true)"
          if [ -n "$BASE_VERSION" ]; then
            echo "pinning the project version to $BASE_VERSION while locking"
            # Deliberately the un-suffixed name: hatch-vcs calls setuptools-scm's get_version()
            # without a dist_name, so the SETUPTOOLS_SCM_PRETEND_VERSION_FOR_<DIST> form is
            # never read. Same finding as the Dockerfiles that build these projects.
            export SETUPTOOLS_SCM_PRETEND_VERSION="$BASE_VERSION"
          fi

          # Word splitting is the point here: one --upgrade-package flag per moved package.
          # shellcheck disable=SC2086
          uv lock $UPGRADES
      # Without this, the commit below goes out unsigned - a required_signatures ruleset then
      # rejects the whole PR even though the eventual squash-merge commit would itself be signed
      # (the rule checks every commit already on the PR branch, not just the merge result). A
      # missing secret is a silent no-op, same as every other optional secret in this job: the
      # commit is just unsigned, exactly as before this step existed.
      - if: env.HAS_TOKEN == 'true' && steps.pr_state.outputs.state == 'OPEN'
        name: Configure commit signing
        env:
          SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "DEPLOY_SIGNING_KEY is not set - the commit below will be unsigned"
            exit 0
          fi
          key_path="$RUNNER_TEMP/lockfiles_signing_key"
          printf '%s\n' "$SIGNING_KEY" > "$key_path"
          chmod 600 "$key_path"
          ssh-keygen -y -f "$key_path" > "$key_path.pub"
          git config gpg.format ssh
          git config user.signingkey "$key_path.pub"
          git config commit.gpgsign true
      - if: env.HAS_TOKEN == 'true' && steps.pr_state.outputs.state == 'OPEN'
        name: Push the refreshed lock files back onto the PR
        env:
          PUSH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: |
          # Only tracked files change here (the lock files); untracked build output stays out.
          git add -u
          if git diff --cached --quiet; then
            echo "lock files already consistent"
            exit 0
          fi
          git config user.name "lukislp"
          git config user.email "koerber.lukas@t-online.de"
          git commit -m "chore(deps): refresh the lock files after the Dependabot update"
          # Several Dependabot PRs open at once, and update-stale may rebase the branch while
          # this job runs, so the push can be rejected. Rebase onto the moved branch and retry;
          # if the manifests themselves moved the rebase conflicts, and failing loudly is right -
          # the next synchronize run regenerates the lock files from the new tip.
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push "$remote" "HEAD:refs/heads/${HEAD_REF}"; then
              exit 0
            fi
            echo "push rejected - the branch moved, rebasing and retrying ($attempt of 3)"
            git fetch "$remote" "refs/heads/${HEAD_REF}" || exit 1
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::the PR branch moved in a way this commit cannot rebase onto; the next synchronize run will regenerate the lock files"
              exit 1
            fi
          done
          echo "::error::the PR branch kept moving; the lock files were not pushed"
          exit 1
