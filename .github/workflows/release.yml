name: Release

# ci-workflows releases itself through the lktec-bot release module (a reusable workflow of
# lukislp/lktec-bot). Tags/releases created here are exactly what every consumer repo's `uses:
# lukislp/ci-workflows/...@<sha> # vX.Y.Z` pin points at. The rules live in .github/lktec-bot.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  get-version:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  release:
    needs: [get-version]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}
