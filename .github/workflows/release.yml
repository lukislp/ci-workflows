name: Release

# ci-workflows dogfoods its own semantic-release/deploy-key-push actions (local ./ references
# below - same commit, so no need for the SHA-pin that every OTHER repo must use for these
# actions). Tags/releases created here are exactly what every consumer repo's `uses:
# lukislp/ci-workflows/...@<sha> # vX.Y.Z` pin points at, so this replaces the manual
# `git tag` step that previously followed every merge to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-version:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # @semantic-release/github's verifyConditions step checks the token has repo push access
    # (contents: write) even during a dry run - a read-only token fails that check outright.
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      # ref: main (branch tip), NOT the push-event SHA - see semantic-release's own job below
      # for why this matters.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Push as the semantic-release deploy key (if configured)
        uses: ./.github/actions/deploy-key-push
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - id: semrel
        uses: ./.github/actions/semantic-release
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci-only) - this is the expected, common case with Conventional Commits, not a failure." | tee -a "$GITHUB_STEP_SUMMARY"

  semantic-release:
    needs: [get-version]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # ref: main for the same reason as get-version's checkout: the real release must be cut
      # from the branch tip get-version analyzed, or the "behind the remote" guard trips on the
      # event SHA whenever another push raced in. The retry below covers a push landing DURING
      # this job (i.e. after this checkout, before this job's own push).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Push as the semantic-release deploy key (if configured)
        uses: ./.github/actions/deploy-key-push
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - id: semrel
        uses: ./.github/actions/semantic-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed between this
      # job's checkout and its own push.
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin main
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/main moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/main did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        uses: ./.github/actions/semantic-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
