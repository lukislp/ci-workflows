name: HACS integration CI/CD

# The one pipeline shared by the Home Assistant custom integrations (studylife-hacs,
# Lagersystem-hacs, gitlab-monitor-hacs): HACS + hassfest validation, ruff, pytest with a
# coverage badge, an Atheris fuzz pass, then the semantic-release chain on the default branch.
# Callers pass the component name, the fuzz harness and their release concurrency group; the
# check names seen by the branch ruleset are "<caller job> / <job below>".
on:
  workflow_call:
    inputs:
      component:
        description: Integration directory name under custom_components/ (coverage target).
        type: string
        required: true
      fuzz-script:
        description: Atheris harness to run for 30 s (path from the repo root); empty skips the fuzz job.
        type: string
        required: false
        default: ""
      release-group:
        description: Concurrency group that serialises get-version and semantic-release per repo.
        type: string
        required: true
      python-version:
        type: string
        required: false
        default: "3.14"
      default-branch:
        type: string
        required: false
        default: main
    secrets:
      SEMANTIC_RELEASE_DEPLOY_KEY:
        description: Write-enabled deploy key so the release commit bypasses the branch ruleset (optional).
        required: false

permissions:
  contents: read

jobs:
  test-hacs-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  test-hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master

  test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install --require-hashes -r requirements_lint.txt
      - run: ruff check .
      - run: ruff format --check .

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install --require-hashes -r requirements_test.txt
      - run: pytest tests/ -v --cov=custom_components/${{ inputs.component }} --cov-report=json:coverage.json
      - run: python3 scripts/generate_coverage_badge.py coverage.json coverage-badge.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge
          path: coverage-badge.json
          retention-days: 7

  fuzz:
    if: inputs.fuzz-script != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install --require-hashes -r requirements_test.txt -r requirements_fuzz.txt
      - run: python ${{ inputs.fuzz-script }} -max_total_time=30 -rss_limit_mb=1024
        env:
          PYTHONPATH: .

  get-version:
    needs: [test-hacs-validation, test-hassfest, test-lint, test-unit]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ inputs.release-group }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      # The default branch tip rather than the event SHA: the release must be computed from what
      # will actually be tagged, even if another push landed in between.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
      # @semantic-release/git's verifyConditions runs `git push --dry-run` even in dry-run mode,
      # so the deploy key is needed here as well.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@d6ea7363956999dc7b3695e8b446f6361b102c6b # v1.5.4
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@d6ea7363956999dc7b3695e8b446f6361b102c6b # v1.5.4
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. semantic-release below skips itself via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  semantic-release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ inputs.release-group }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@d6ea7363956999dc7b3695e8b446f6361b102c6b # v1.5.4
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      # The coverage badge from test-unit is committed with the release (an @semantic-release/git
      # asset in the caller's .releaserc.json).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge
          path: coverage-artifact
      - run: mkdir -p .github/badges && mv coverage-artifact/coverage-badge.json .github/badges/coverage.json
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@d6ea7363956999dc7b3695e8b446f6361b102c6b # v1.5.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push landed between this job's
      # checkout and its own push (the concurrency group serialises this workflow's own runs, so
      # only a genuinely external push can cause it).
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        env:
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/$DEFAULT_BRANCH moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/$DEFAULT_BRANCH did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
      - if: steps.semrel.outcome == 'failure'
        uses: lukislp/ci-workflows/.github/actions/semantic-release@d6ea7363956999dc7b3695e8b446f6361b102c6b # v1.5.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
