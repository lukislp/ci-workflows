name: HACS integration CI/CD

# The one validation pipeline shared by the Home Assistant custom integrations (studylife-hacs,
# Lagersystem-hacs, gitlab-monitor-hacs): HACS + hassfest validation, ruff, pytest with a
# coverage badge and an Atheris fuzz pass. Callers pass the component name and the fuzz harness.
# Releases are not part of this workflow: they go through the lktec-bot release module.
# The check names seen by the branch ruleset are "<caller job> / <job below>".
on:
  workflow_call:
    inputs:
      component:
        description: Integration directory name under custom_components/ (coverage target).
        type: string
        required: true
      fuzz-script:
        description: Atheris harness to run for 30 s (path from the repo root); empty skips the fuzz job.
        type: string
        required: false
        default: ""
      release-group:
        description: "Deprecated and ignored: the release stage moved to the lktec-bot release module; this input is accepted for one more minor version so that callers passing it keep working."
        type: string
        required: false
        default: ""
      release:
        description: "Deprecated and ignored: the release stage moved to the lktec-bot release module; this input is accepted for one more minor version so that callers passing `release: false` keep working."
        type: boolean
        required: false
        default: false
      python-version:
        type: string
        required: false
        default: "3.14"
      default-branch:
        description: "Deprecated and ignored: it only selected the release checkout; accepted for one more minor version."
        type: string
        required: false
        default: main
permissions:
  contents: read

jobs:
  test-hacs-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  test-hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install --require-hashes -r requirements_lint.txt
      - run: ruff check .
      - run: ruff format --check .

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install --require-hashes -r requirements_test.txt
      - run: pytest tests/ -v --cov=custom_components/${{ inputs.component }} --cov-report=json:coverage.json
      - run: python3 scripts/generate_coverage_badge.py coverage.json coverage-badge.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: coverage-badge.json
          retention-days: 7

  fuzz:
    if: inputs.fuzz-script != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install --require-hashes -r requirements_test.txt -r requirements_fuzz.txt
      - run: python ${{ inputs.fuzz-script }} -max_total_time=30 -rss_limit_mb=1024
        env:
          PYTHONPATH: .
