name: Dependabot auto-merge (reusable)

# Shared implementation of every repo's dependabot-auto-merge workflow. The caller keeps the
# triggers (pull_request_target, hourly schedule, push to the default branch) and passes
# AUTOMERGE_TOKEN; everything below runs with the CALLER's event context.
#
# auto-merge: merges Dependabot patch and minor updates, and Docker digest refreshes of an
# unchanged tag, once every required check is green; majors stay manual. Runs on pull_request_target so the base branch's workflow definition and
# the repo secrets apply (a Dependabot-triggered pull_request run gets neither). Merges with
# AUTOMERGE_TOKEN, a fine-grained PAT (contents + pull requests: write): a merge performed with
# GITHUB_TOKEN would never start the release workflow, because GitHub does not run workflows for
# events caused by GITHUB_TOKEN. Deliberately no checkout - PR code is never executed here.
#
# update-stale: the default branch requires PRs to be up to date before they merge (ruleset), so
# every push there leaves the open PRs "behind". This brings every non-draft PR that has
# auto-merge enabled or was opened by a person back onto the tip; a Dependabot PR left for a
# manual decision (a major bump) is not rebuilt on every push - whoever merges it updates it.
# A Dependabot PR WITHOUT auto-merge is first re-classified from its title: the auto-merge job
# runs once, at creation, under whatever version of this workflow the caller pinned at that
# moment, and nothing ever re-runs it - so a routine update it did not recognise back then
# (Docker digest refreshes before v1.7.3) sat forever. Such a PR gets auto-merge enabled on the
# next tick; a real major still stays manual.
# It also retries a direct merge for every Dependabot PR that has auto-merge requested: a repo
# ruleset requiring 1 approving review lets an admin bypass that rule on a direct merge, but
# GitHub's own `--auto` completion never exercises that bypass - it only fires once the PR's
# ordinary mergeable state (reviews included) is clean, which never happens on its own. The
# direct merge uses the same bypass a human already has via the PR page's "Merge without
# waiting for requirements to be met" checkbox. Confirmed stuck without this: 8 patch/minor PRs
# on piwatch sat BLOCKED/REVIEW_REQUIRED for 11+ hours with every check green (2026-09-21).
#
# That bypass is NOT limited to the review rule. An admin token's direct merge also skips
# required_status_checks (bypass_mode "pull_request" covers every rule of the ruleset), so a
# plain `gh pr merge --squash` goes through while checks are still pending or already red.
# Confirmed 2026-09-23: studylife-alexa #103 merged one second after its CI run was queued,
# studylife-app #46 and studylife-tray #35 merged with a red CI - all four mains were broken
# by the hourly tick. The job therefore verifies the PR's own checks before every direct merge
# and never merges a branch it has just moved (its checks are not even queued yet).
#
# exclude-dependencies: dependencies that must never be merged without a person looking at
# them, however small the bump (for example a library that talks to real hardware and has to
# be tried on the device first). A PR that updates any listed dependency - in a grouped PR, any
# one of the group - is never approved, never gets auto-merge enabled and is never merged
# directly by either job; it waits for a manual merge like a major. update-stale still keeps
# such a PR mergeable (update-branch when BEHIND, "@dependabot recreate" when DIRTY) once a
# person has armed auto-merge on it, so a tested PR does not rot; GitHub's own auto-merge then
# completes it after that person's approval. With the input empty (the default) nothing changes.
on:
  workflow_call:
    inputs:
      exclude-dependencies:
        description: >-
          Dependency names (comma and/or whitespace separated, case-insensitive, exact name
          match) whose Dependabot PRs are never approved or merged automatically. A grouped PR
          is skipped as a whole when any of its dependencies is listed. Default: none.
        type: string
        required: false
        default: ""
    secrets:
      AUTOMERGE_TOKEN:
        description: Fine-grained PAT with contents + pull requests write on the calling repo.
        required: false

permissions:
  pull-requests: read

jobs:
  auto-merge:
    # The PR AUTHOR, not github.actor. On a synchronize event the actor is whoever pushed
    # last, and update-stale below rebases open Dependabot PRs with AUTOMERGE_TOKEN - which
    # made every follow-up run of this job skip re-confirming auto-merge, leaving PRs stuck
    # with auto-merge silently unset after their first rebase. Same bug, same fix as
    # dependabot-lockfiles.yml already applies; this job just never got the backport. The
    # author never changes, so this gate is both more reliable and stricter: it still only
    # ever runs on Dependabot PRs.
    if: github.event_name == 'pull_request_target' && github.event.action != 'auto_merge_enabled' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # What counts as routine: a semver patch or minor bump, or a Docker digest refresh - the
      # same tag, only the pinned sha256 moves (Dependabot titles those "bump python from
      # `78387bc` to `2f17fc0`"). fetch-metadata reports no update-type for a digest-only bump,
      # so without this every base-image refresh sat BEHIND until someone merged it by hand
      # (six of them across five repos on 2026-09-23). A tag change on a docker dependency still
      # carries a real update-type and is judged by it like any other version bump.
      - id: kind
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          routine=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) routine=true ;;
          esac
          if [ "$ECOSYSTEM" = "docker" ] && [ -z "$UPDATE_TYPE" ]              && printf '%s' "$TITLE" | grep -Eq 'from `[0-9a-f]{7,64}` to `[0-9a-f]{7,64}`'; then
            routine=true
            echo "docker digest refresh - treated like a patch bump"
          fi
          echo "routine=$routine" >> "$GITHUB_OUTPUT"
      # exclude-dependencies (see the header). fetch-metadata lists every dependency of the PR,
      # all members of a group included, as a comma-separated string.
      - id: exclude
        if: inputs.exclude-dependencies != ''
        env:
          EXCLUDE: ${{ inputs.exclude-dependencies }}
          DEPENDENCIES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -f
          hit=""
          for d in $(printf '%s' "$DEPENDENCIES" | tr ',' ' ' | tr '[:upper:]' '[:lower:]'); do
            for x in $(printf '%s' "$EXCLUDE" | tr ',' ' ' | tr '[:upper:]' '[:lower:]'); do
              if [ "$d" = "$x" ]; then hit="$hit $d"; fi
            done
          done
          if [ -n "$hit" ]; then
            echo "::notice::excluded dependency in this PR:$hit - no approval, no auto-merge, merge it by hand"
            echo "excluded=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$DEPENDENCIES" ]; then
            # Fail safe: with exclusions configured, a PR whose dependencies cannot be read is
            # not merged blindly.
            echo "::notice::dependency names unknown - not merging automatically while exclude-dependencies is set"
            echo "excluded=true" >> "$GITHUB_OUTPUT"
          else
            echo "excluded=false" >> "$GITHUB_OUTPUT"
          fi
      - if: env.HAS_TOKEN == 'true' && steps.kind.outputs.routine == 'true' && steps.exclude.outputs.excluded != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        # A repo ruleset requiring 1 approving review needs an actual review to pass - a
        # fine-grained PAT scoped to contents+pull-requests write (this token) does NOT get
        # the admin ruleset bypass that the same account's browser session or a broader token
        # would (confirmed live 2026-09-21: a direct merge attempt with this token still came
        # back not-mergeable with every check green, no error surfaced since GitHub just
        # evaluates the token's own grants). Approving satisfies the rule the ordinary way
        # instead, using a permission this token already has. Skip if already approved - this
        # job re-runs on every synchronize (including update-stale's own update-branch calls),
        # and a repeat approval from the same account just clutters the PR's timeline for no
        # benefit (GitHub already counts the first one).
        run: |
          review="$(gh pr view "${{ github.event.pull_request.html_url }}" --json reviewDecision --jq .reviewDecision)"
          if [ "$review" != "APPROVED" ]; then
            gh pr review --approve "${{ github.event.pull_request.html_url }}"
          fi
      - if: env.HAS_TOKEN == 'true' && steps.kind.outputs.routine == 'true' && steps.exclude.outputs.excluded != 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        # Squash, not merge. A merge commit carries every commit the branch accumulated into
        # main - and the lock-file refresh job can add a lot of them. Before v1.5.2 it could
        # trigger itself, and studylife-mcp ended up with 110 "refresh the lock files" commits
        # in main, studylife-cli with 71, because those PRs were merged rather than squashed.
        # One Dependabot update should be one commit in main whatever happened on the branch.
        # Every repo using this workflow allows squash merges (checked 2026-09-17).
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
      - if: env.HAS_TOKEN != 'true'
        run: echo "AUTOMERGE_TOKEN is not set - leaving this PR for a manual merge"

  update-stale:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.action == 'auto_merge_enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          EXCLUDE: ${{ inputs.exclude-dependencies }}
        # GitHub computes the merge state lazily after a push, so UNKNOWN is polled for a while;
        # DIRTY (conflicts) cannot be updated automatically.
        run: |
          exclude_list="$(printf '%s' "$EXCLUDE" | tr ',' ' ' | tr '[:upper:]' '[:lower:]')"
          # Prints the excluded dependencies a Dependabot PR updates (nothing if none) and fails
          # when they cannot be determined. fetch-metadata only exists in the PR event, so the
          # source here is the "updated-dependencies:" block Dependabot writes into every commit
          # message (one "- dependency-name:" line per dependency, all members of a group
          # included); the PR title ("bump <name> from ...", "bump <a> and <b>") is the fallback.
          excluded_deps() {
            local deps title d x hit=""
            deps="$(gh api --paginate "repos/$REPO/pulls/$1/commits" --jq '.[].commit.message' \
              | sed -n 's/^[[:space:]]*-[[:space:]]*dependency-name:[[:space:]]*//p' \
              | tr -d "\"'\r" | sort -u)"
            if [ -z "$deps" ]; then
              title="$(gh pr view "$1" --repo "$REPO" --json title --jq .title)"
              deps="$(printf '%s' "$title" | sed -nE 's/^.*[Bb]ump(s)? (.+) from .*$/\2/p; s/^.*[Bb]ump(s)? (.+) and (.+)$/\2 \3/p' | grep -v '^the ' || true)"
            fi
            [ -n "$deps" ] || return 1
            set -f
            for d in $(printf '%s' "$deps" | tr ',' ' ' | tr '[:upper:]' '[:lower:]'); do
              for x in $exclude_list; do
                if [ "$d" = "$x" ]; then hit="$hit $d"; fi
              done
            done
            set +f
            printf '%s' "$hit"
          }
          for n in $(gh pr list --repo "$REPO" --state open --json number --jq '.[].number'); do
            info="$(gh pr view "$n" --repo "$REPO" --json isDraft,author,autoMergeRequest --jq '"\(.isDraft) \(.author.login) \(.autoMergeRequest != null)"')"
            set -- $info
            draft=$1; author=$2; auto=$3
            [ "$draft" = "true" ] && continue
            # exclude-dependencies (see the header): never approved, never armed, never merged
            # here. Fail safe - a PR whose dependencies cannot be read counts as excluded.
            excluded=false
            if [ -n "$exclude_list" ] && [ "$author" = "app/dependabot" ]; then
              if hit="$(excluded_deps "$n")"; then
                if [ -n "$hit" ]; then excluded=true; fi
              else
                hit=" (dependencies could not be determined)"
                excluded=true
              fi
              if [ "$excluded" = "true" ]; then
                echo "::notice::#$n excluded from auto-merge:$hit - left for a manual merge"
                # Without auto-merge armed by a person there is nothing to keep up to date.
                if [ "$auto" != "true" ]; then continue; fi
              fi
            fi
            if [ "$auto" != "true" ] && [ "$author" = "app/dependabot" ]; then
              # Either the auto-merge job judged this a major, or it judged it under an OLDER
              # version of this workflow that did not know the update kind yet. It only runs on
              # pull_request_target - once, at creation - and nothing re-runs it: HouseHoldPlanner
              # #67 and homelab-autodoc #190 (Docker digest refreshes, opened 2026-09-28 under a
              # v1.7.1 pin) never got auto-merge although the digest rule had shipped in v1.7.3.
              # Re-classify from the title, the only input available outside the PR event: a
              # digest refresh ("from `hex` to `hex`") or a version bump with an unchanged major
              # is routine and gets auto-merge enabled now. Anything else - a major, a SHA-to-SHA
              # action bump (fetch-metadata calls that a major too), a group PR - stays a manual
              # decision exactly as before.
              title="$(gh pr view "$n" --repo "$REPO" --json title --jq .title)"
              routine=false
              if printf '%s' "$title" | grep -Eq 'from `[0-9a-f]{7,64}` to `[0-9a-f]{7,64}`'; then
                routine=true
              elif versions="$(printf '%s' "$title" | grep -Eo 'from v?[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]*)? to v?[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]*)?( |$)' | head -1)" && [ -n "$versions" ]; then
                set -- $versions
                old_major="${2#v}"; old_major="${old_major%%[.+-]*}"
                new_major="${4#v}"; new_major="${new_major%%[.+-]*}"
                [ "$old_major" = "$new_major" ] && routine=true
              fi
              if [ "$routine" != "true" ]; then continue; fi
              echo "#$n ($author): routine update the auto-merge job never picked up - enabling auto-merge"
              gh pr review "$n" --repo "$REPO" --approve >/dev/null 2>&1 || true
              gh pr merge --auto --squash "$n" --repo "$REPO" >/dev/null 2>&1 || echo "::warning::could not enable auto-merge on #$n"
              auto=true
            fi
            for attempt in 1 2 3 4 5 6; do
              state="$(gh pr view "$n" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)"
              [ "$state" != "UNKNOWN" ] && break
              sleep 10
            done
            echo "#$n ($author, auto-merge=$auto): $state"
            updated=false
            if [ "$state" = "BEHIND" ]; then
              gh api -X PUT "repos/$REPO/pulls/$n/update-branch" >/dev/null && { updated=true; echo "  updated onto the default branch"; } || echo "::warning::could not update #$n"
            fi
            if [ "$auto" = "true" ] && [ "$author" = "app/dependabot" ]; then
              if [ "$excluded" = "true" ]; then
                # Armed by a person after testing: keep it mergeable, but the approval and the
                # merge stay theirs (GitHub's auto-merge completes it once they approved).
                if [ "$state" = "DIRTY" ]; then
                  echo "  has conflicts - asking Dependabot to recreate the PR"
                  gh pr comment "$n" --repo "$REPO" --body "@dependabot recreate" >/dev/null 2>&1 || echo "::warning::could not comment on #$n"
                fi
                echo "  excluded dependency - no approval, no direct merge"
                continue
              fi
              review="$(gh pr view "$n" --repo "$REPO" --json reviewDecision --jq .reviewDecision)"
              if [ "$review" != "APPROVED" ]; then
                gh pr review "$n" --repo "$REPO" --approve >/dev/null 2>&1
              fi
              # The direct merge below bypasses required status checks (see the header), so it
              # must only ever run against a PR whose checks are demonstrably green: not one whose
              # branch was just moved (checks not queued yet), not one with conflicts, and not one
              # with any check still pending, failed or cancelled. Anything else waits for the
              # next tick, which is exactly what the hourly schedule is for.
              if [ "$updated" = "true" ]; then
                echo "  branch just updated - checks not started yet, next tick"
                continue
              fi
              if [ "$state" = "DIRTY" ]; then
                # Dependabot rebases its own PRs on conflict - but only while the branch holds
                # nothing but its own commits. The lockfiles job and update-branch above add
                # commits of ours, after which Dependabot leaves a conflicting branch alone for
                # good (UnifiProtectDashboard #113 and #118, 2026-09-29/10-01: two SkiaSharp bumps
                # in a row, the second one DIRTY on packages.lock.json until "@dependabot recreate"
                # was typed by hand). recreate discards the branch and rebuilds the PR from the
                # current default branch; the comment is idempotent, so repeating it on a later
                # tick while the PR is still DIRTY is harmless.
                echo "  has conflicts - asking Dependabot to recreate the PR"
                gh pr comment "$n" --repo "$REPO" --body "@dependabot recreate" >/dev/null 2>&1 || echo "::warning::could not comment on #$n"
                continue
              fi
              not_green="$(gh pr view "$n" --repo "$REPO" --json statusCheckRollup --jq '[.statusCheckRollup[] | (.conclusion // .state) | select(. != "SUCCESS" and . != "SKIPPED" and . != "NEUTRAL")] | length')"
              if [ "$not_green" != "0" ]; then
                echo "  $not_green check(s) pending or not green - not merging"
                continue
              fi
              gh pr merge "$n" --repo "$REPO" --squash >/dev/null 2>&1 && echo "  merged" || echo "  not ready yet"
            fi
          done
      - if: env.HAS_TOKEN != 'true'
        run: echo "AUTOMERGE_TOKEN is not set - open PRs are not brought up to date automatically"
