name: Dependabot auto-merge (reusable)

# Shared implementation of every repo's dependabot-auto-merge workflow. The caller keeps the
# triggers (pull_request_target, hourly schedule, push to the default branch) and passes
# AUTOMERGE_TOKEN; everything below runs with the CALLER's event context.
#
# auto-merge: merges Dependabot patch and minor updates once every required check is green;
# majors stay manual. Runs on pull_request_target so the base branch's workflow definition and
# the repo secrets apply (a Dependabot-triggered pull_request run gets neither). Merges with
# AUTOMERGE_TOKEN, a fine-grained PAT (contents + pull requests: write): a merge performed with
# GITHUB_TOKEN would never start the release workflow, because GitHub does not run workflows for
# events caused by GITHUB_TOKEN. Deliberately no checkout - PR code is never executed here.
#
# update-stale: the default branch requires PRs to be up to date before they merge (ruleset), so
# every push there leaves the open PRs "behind". This brings every non-draft PR that has
# auto-merge enabled or was opened by a person back onto the tip; a Dependabot PR left for a
# manual decision (a major bump) is not rebuilt on every push - whoever merges it updates it.
on:
  workflow_call:
    secrets:
      AUTOMERGE_TOKEN:
        description: Fine-grained PAT with contents + pull requests write on the calling repo.
        required: false

permissions:
  pull-requests: read

jobs:
  auto-merge:
    if: github.event_name == 'pull_request_target' && github.event.action != 'auto_merge_enabled' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: env.HAS_TOKEN == 'true' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        # Squash, not merge. A merge commit carries every commit the branch accumulated into
        # main - and the lock-file refresh job can add a lot of them. Before v1.5.2 it could
        # trigger itself, and studylife-mcp ended up with 110 "refresh the lock files" commits
        # in main, studylife-cli with 71, because those PRs were merged rather than squashed.
        # One Dependabot update should be one commit in main whatever happened on the branch.
        # Every repo using this workflow allows squash merges (checked 2026-09-17).
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
      - if: env.HAS_TOKEN != 'true'
        run: echo "AUTOMERGE_TOKEN is not set - leaving this PR for a manual merge"

  update-stale:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.action == 'auto_merge_enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
        # GitHub computes the merge state lazily after a push, so UNKNOWN is polled for a while;
        # DIRTY (conflicts) cannot be updated automatically.
        run: |
          for n in $(gh pr list --repo "$REPO" --state open --json number --jq '.[].number'); do
            info="$(gh pr view "$n" --repo "$REPO" --json isDraft,author,autoMergeRequest --jq '"\(.isDraft) \(.author.login) \(.autoMergeRequest != null)"')"
            set -- $info
            draft=$1; author=$2; auto=$3
            [ "$draft" = "true" ] && continue
            if [ "$auto" != "true" ] && [ "$author" = "app/dependabot" ]; then continue; fi
            for attempt in 1 2 3 4 5 6; do
              state="$(gh pr view "$n" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)"
              [ "$state" != "UNKNOWN" ] && break
              sleep 10
            done
            echo "#$n ($author, auto-merge=$auto): $state"
            if [ "$state" = "BEHIND" ]; then
              gh api -X PUT "repos/$REPO/pulls/$n/update-branch" >/dev/null && echo "  updated onto the default branch" || echo "::warning::could not update #$n"
            fi
          done
      - if: env.HAS_TOKEN != 'true'
        run: echo "AUTOMERGE_TOKEN is not set - open PRs are not brought up to date automatically"
