# Keeps the SHA pins of the actions used by the shared workflows and composite actions moving,
# and the pinned semantic-release toolchain of the semantic-release action current.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
  - package-ecosystem: npm
    directory: /.github/actions/semantic-release
    schedule:
      interval: daily
    groups:
      semantic-release:
        patterns: ["semantic-release", "@semantic-release/*"]
    commit-message:
      prefix: "fix(semantic-release)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
